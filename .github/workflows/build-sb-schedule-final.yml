name: Build SB Schedule Final APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-sb-schedule-final.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack corrected project
        run: |
          unzip -q SB-Schedule-fixed.zip -d project
          rm -f project/app/src/main/java/com/sb/workcalendar/WorkWidget.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: project
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Schedule-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk

          mkdir -p "project/$(dirname 'app/src/main/res/drawable/widget_today_bg.xml')"
          echo 'PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+PHNvbGlkIGFuZHJvaWQ6Y29sb3I9IiNGRkYwRjQiLz48c3Ryb2tlIGFuZHJvaWQ6d2lkdGg9IjJkcCIgYW5kcm9pZDpjb2xvcj0iI0YwNkE4QSIvPjxjb3JuZXJzIGFuZHJvaWQ6cmFkaXVzPSI3ZHAiLz48L3NoYXBlPgo=' | base64 -d > "project/app/src/main/res/drawable/widget_today_bg.xml"
          mkdir -p "project/$(dirname 'app/src/main/res/drawable/widget_duty_bg.xml')"
          echo 'PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+PHNvbGlkIGFuZHJvaWQ6Y29sb3I9IiNFRUYwRjgiLz48Y29ybmVycyBhbmRyb2lkOnJhZGl1cz0iNmRwIi8+PC9zaGFwZT4K' | base64 -d > "project/app/src/main/res/drawable/widget_duty_bg.xml"

          mkdir -p "project/$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          echo 'PGFkYXB0aXZlLWljb24geG1sbnM6YW5kcm9pZD0iaHR0cDovL3NjaGVtYXMuYW5kcm9pZC5jb20vYXBrL3Jlcy9hbmRyb2lkIj48YmFja2dyb3VuZCBhbmRyb2lkOmRyYXdhYmxlPSJAY29sb3IvbGF1bmNoZXJfYmciLz48Zm9yZWdyb3VuZCBhbmRyb2lkOmRyYXdhYmxlPSJAZHJhd2FibGUvaWNfbGF1bmNoZXJfZm9yZWdyb3VuZCIvPjwvYWRhcHRpdmUtaWNvbj4K' | base64 -d > "project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          mkdir -p "project/$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml')"
          echo 'PGFkYXB0aXZlLWljb24geG1sbnM6YW5kcm9pZD0iaHR0cDovL3NjaGVtYXMuYW5kcm9pZC5jb20vYXBrL3Jlcy9hbmRyb2lkIj48YmFja2dyb3VuZCBhbmRyb2lkOmRyYXdhYmxlPSJAY29sb3IvbGF1bmNoZXJfYmciLz48Zm9yZWdyb3VuZCBhbmRyb2lkOmRyYXdhYmxlPSJAZHJhd2FibGUvaWNfbGF1bmNoZXJfZm9yZWdyb3VuZCIvPjwvYWRhcHRpdmUtaWNvbj4K' | base64 -d > "project/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          mkdir -p "project/$(dirname 'app/src/main/res/xml/widget_combined_month.xml')"
          echo '' | base64 -d > "project/app/src/main/res/xml/widget_combined_month.xml"
          mkdir -p "project/$(dirname 'app/src/main/res/xml/widget_work_month.xml')"
          echo '' | base64 -d > "project/app/src/main/res/xml/widget_work_month.xml"
          mkdir -p "project/$(dirname 'app/src/main/res/xml/widget_schedule_month.xml')"
          echo '' | base64 -d > "project/app/src/main/res/xml/widget_schedule_month.xml"
          mkdir -p "$HOME/.android"
          echo '' | base64 -d > "$HOME/.android/debug.keystore"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and verify APK
        working-directory: project
        run: gradle clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Schedule-V3-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk


name: Build SB Schedule V3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-sb-schedule-v3.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SB Schedule V3
        run: |
          unzip -q SB-Schedule-fixed.zip -d project
          rm -f project/app/src/main/java/com/sb/workcalendar/WorkWidget.java
          mkdir -p "project/$(dirname 'app/build.gradle')"
          echo '' | base64 -d > "project/app/build.gradle"
          mkdir -p "project/$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > "project/app/src/main/AndroidManifest.xml"
          mkdir -p "project/$(dirname 'app/src/main/java/com/sb/workcalendar/MainActivity.java')"
          echo '' | base64 -d > "project/app/src/main/java/com/sb/workcalendar/MainActivity.java"
          mkdir -p "project/$(dirname 'app/src/main/java/com/sb/workcalendar/Store.java')"
          echo '' | base64 -d > "project/app/src/main/java/com/sb/workcalendar/Store.java"
          mkdir -p "project/$(dirname 'app/src/main/java/com/sb/workcalendar/WidgetBase.java')"
          echo '' | base64 -d > "project/app/src/main/java/com/sb/workcalendar/WidgetBase.java"
          mkdir -p "project/$(dirname 'app/src/main/res/layout/widget_calendar.xml')"
          echo '' | base64 -d > "project/app/src/main/res/layout/widget_calendar.xml"
          mkdir -p "project/$(dirname 'app/src/main/res/layout/widget_row.xml')"
          echo '' | base64 -d > "project/app/src/main/res/layout/widget_row.xml"
          mkdir -p "project/$(dirname 'app/src/main/res/layout/widget_cell.xml')"
          echo '' | base64 -d > "project/app/src/main/res/layout/widget_cell.xml"
          mkdir -p "project/$(dirname 'app/src/main/res/layout/widget_week.xml')"
          echo '' | base64 -d > "project/app/src/main/res/layout/widget_week.xml"
          mkdir -p "project/$(dirname 'app/src/main/res/drawable/widget_bg.xml')"
          echo 'PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+PHNvbGlkIGFuZHJvaWQ6Y29sb3I9IiNGOEY5RkMiLz48c3Ryb2tlIGFuZHJvaWQ6d2lkdGg9IjFkcCIgYW5kcm9pZDpjb2xvcj0iI0RERTJFRSIvPjxjb3JuZXJzIGFuZHJvaWQ6cmFkaXVzPSIyMmRwIi8+PC9zaGFwZT4K' | base64 -d > "project/app/src/main/res/drawable/widget_bg.xml"
